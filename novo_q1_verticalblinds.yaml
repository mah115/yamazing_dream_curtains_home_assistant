name: Vertical blinds
products:
  - id: f4jrc6yn2pfqhnco
    manufacturer: Novo
    model: Q1-3E-1.2
entities:
  - entity: cover
    class: curtain
    dps:
      - id: 1
        type: string
        name: control
        optional: true
        mapping:
          - dps_val: open
            value: open
          - dps_val: close
            value: close
          - dps_val: stop
            value: stop
      - id: 2
        type: integer
        name: tilt_position
        optional: true
        # dp 2 sets the vane angle but is not reported locally, so the
        # angle is read back from dp 3. No range declared: the dps are
        # already 0-100, and a declared range of 0-100 gets rescaled so
        # that 0% is sent as -1.
        mapping:
          - dps_val: null
            value_mirror: tilt_state
      - id: 3
        type: integer
        name: tilt_state
      - id: 7
        type: string
        name: action
        optional: true
        mapping:
          - dps_val: opening
            value: opening
          - dps_val: closing
            value: closing
      - id: 10
        type: integer
        name: travel_time
        optional: true
  - entity: switch
    name: Reverse
    icon: "mdi:arrow-u-down-left"
    category: config
    dps:
      - id: 5
        type: string
        name: switch
        mapping:
          - dps_val: back
            value: true
          - dps_val: forward
            value: false
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 12
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 12
        type: bitfield
        name: fault_code
